name: Deploy GitHub Pages

# Runs after the Tests workflow succeeds on main, and on a manual run.
# A push to main does not deploy by itself. The test jobs have to finish green first.
on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install poppler
        if: github.event_name == 'workflow_dispatch'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci
      - name: Refuse the test signing key
        run: node tools/assert-production-key.mjs
      - name: Re-run tests before a manual deploy
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm test
          npx playwright install --with-deps chromium firefox webkit
          npm run test:e2e
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
